name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: |
          chmod +x android/gradlew
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare APK Artifact
        id: prep
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.1.0}"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/Luma-${TAG_NAME}.apk"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "apk_path=build/app/outputs/flutter-apk/Luma-${TAG_NAME}.apk" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Luma ${{ steps.prep.outputs.tag_name }}"
          tag_name: ${{ steps.prep.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/Luma-*.apk

      - name: Upload Artifact (on manual workflow dispatch)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: luma-apk
          path: build/app/outputs/flutter-apk/Luma-*.apk
